id: registration/create-question
version: 1
goal: >
  Ensure one registration question exists with the requested key, text, page,
  order, answer type, answer values, and required state.
preconditions:
  - Event exists and is bound to the run's event id
  - Registration configuration is available for the Draft event
steps:
  - description: Open the registration question manager
    selectorHint: "TODO"
  - description: Find question key {{question.key}} or begin creating it if absent
    selectorHint: "TODO"
  - description: Apply the exact question configuration {{question}}
    selectorHint: "TODO"
  - description: Save and confirm the question configuration
    selectorHint: "TODO"
idempotency:
  check: "A single question with key {{question.key}} exists and its configuration equals {{question}}"
failureModes:
  - symptom: "A question with the requested text exists under a different identity"
    action: "Halt and report the conflict; do not create a likely duplicate."
  - symptom: "The requested page or answer type is unavailable"
    action: "Halt and report the unavailable value; do not substitute another configuration."
provenance:
  authoredBy: human
  validatedAgainst: null
  lastReviewed: null
