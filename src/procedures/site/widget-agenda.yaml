id: site/widget-agenda
version: 1
goal: >
  Place the specified agenda widget at the requested page index with its heading
  and speaker visibility setting.
preconditions:
  - The website page with key {{pageKey}} exists
  - The page is open in the website designer
steps:
  - description: Open page {{pageKey}} and inspect widget position {{index}}
    selectorHint: "TODO"
  - description: Add or select the agenda widget at position {{index}}
    selectorHint: "TODO"
  - description: Apply the exact agenda widget configuration {{widget}}
    selectorHint: "TODO"
  - description: Save and confirm the heading and speaker visibility setting
    selectorHint: "TODO"
idempotency:
  check: "Widget position {{index}} on page {{pageKey}} is one agenda widget whose configuration equals {{widget}}"
failureModes:
  - symptom: "Agenda data is unavailable in the site designer"
    action: "Halt and report the empty or unavailable agenda state."
  - symptom: "The requested widget position is occupied by a different widget type"
    action: "Halt and report the existing type; do not delete or reorder content."
provenance:
  authoredBy: human
  validatedAgainst: null
  lastReviewed: null
