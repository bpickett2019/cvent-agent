id: site/widget-image
version: 1
goal: >
  Place the specified image widget at the requested page index with its image,
  alt text, caption, and full-width setting.
preconditions:
  - The website page with key {{pageKey}} exists
  - The referenced image asset is available from its declared source
steps:
  - description: Open page {{pageKey}} and inspect widget position {{index}}
    selectorHint: "TODO"
  - description: Add or select the image widget at position {{index}}
    selectorHint: "TODO"
  - description: Apply the exact image widget configuration {{widget}}
    selectorHint: "TODO"
  - description: Save and confirm the image, caption, alt text, and width setting
    selectorHint: "TODO"
idempotency:
  check: "Widget position {{index}} on page {{pageKey}} is one image widget whose configuration equals {{widget}}"
failureModes:
  - symptom: "The referenced image cannot be uploaded or resolved"
    action: "Halt and report the asset reference; do not substitute another image."
  - symptom: "The requested widget position is occupied by a different widget type"
    action: "Halt and report the existing type; do not delete or reorder content."
provenance:
  authoredBy: human
  validatedAgainst: null
  lastReviewed: null
