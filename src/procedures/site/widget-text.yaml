id: site/widget-text
version: 2
goal: Reconcile one text widget on the exact website page with one save and independent read-back.
preconditions:
  - Event URL evtstub equals the run event id, exact event name is visible, and title is Site Designer
  - Top-level Save is disabled at task start
steps:
  - description: Open page {{pageKey}} and read the current widget inventory before writing
    selectorHint: '[data-cvent-id="nucleus-site-editor-site-header"]'
    verify: 'Exact page name and WEBSITE PAGE type are visible; canvas-base and page-renderer-editable-page-content are present'
    onMiss: Halt on HEADER AND FOOTER, a registration page, inherited locked content, or an ambiguous page.
  - description: Find the unique widget identity for index {{index}} or place the exact mapped text catalog tile, then reconcile {{widget}}
    selectorHint: '[data-cvent-id="widget-category-customContent-NucleusText"]'
    value: '{{widget}}'
    onMiss: Halt if the exact catalog tile, target container, asset, or inspector field is unavailable; do not substitute another widget type or use coordinates.
  - description: Reassert the exact WEBSITE PAGE surface and save the complete widget reconciliation exactly once
    selectorHint: '[data-cvent-id="site-designer-save-button"]'
    verify: 'The same page remains selected and Save returns to disabled'
  - description: Reload the same event-scoped route, reopen the exact page, and independently read back the widget
    selectorHint: '[data-cvent-id^="widget-"]'
    verify: 'Unique widget identity, rendered content, inspector values, placement, and asset references exactly equal {{widget}}'
idempotency:
  check: 'A unique widget at {{pageKey}}/{{index}} already reads back exactly as {{widget}}; if equal, do not place or save.'
failureModes:
  - symptom: Event, clean-state, exact-surface, widget identity, target container, or inspector guard fails
    action: Halt without changing state or placing a duplicate.
  - symptom: Read back differs after reload
    action: Report FAIL with before, intended, and after values; do not retry Save.
provenance:
  authoredBy: agent-proposed
  validatedAgainst: retained-agent-6-site-designer-map
  lastReviewed: '2026-09-01'
