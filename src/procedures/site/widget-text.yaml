id: site/widget-text
version: 1
goal: >
  Place the specified text widget at the requested index on the target page,
  including its heading, body, and alignment.
preconditions:
  - The website page with key {{pageKey}} exists
  - The page is open in the website designer
steps:
  - description: Open page {{pageKey}} and inspect widget position {{index}}
    selectorHint: "TODO"
  - description: Add or select the text widget at position {{index}}
    selectorHint: "TODO"
  - description: Apply the exact text widget configuration {{widget}}
    selectorHint: "TODO"
  - description: Save and confirm the text widget content and alignment
    selectorHint: "TODO"
idempotency:
  check: "Widget position {{index}} on page {{pageKey}} is one text widget whose configuration equals {{widget}}"
failureModes:
  - symptom: "The requested widget position is occupied by a different widget type"
    action: "Halt and report the existing type; do not delete or reorder content."
  - symptom: "Rich-text normalization changes the supplied body"
    action: "Halt and report the observed text rather than accepting a non-exact value."
provenance:
  authoredBy: human
  validatedAgainst: null
  lastReviewed: null
