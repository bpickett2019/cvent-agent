id: site/widget-divider
version: 1
goal: >
  Place the specified divider widget at the requested page index using the exact
  line or space style.
preconditions:
  - The website page with key {{pageKey}} exists
  - The page is open in the website designer
steps:
  - description: Open page {{pageKey}} and inspect widget position {{index}}
    selectorHint: "TODO"
  - description: Add or select the divider widget at position {{index}}
    selectorHint: "TODO"
  - description: Apply the exact divider widget configuration {{widget}}
    selectorHint: "TODO"
  - description: Save and confirm the divider style
    selectorHint: "TODO"
idempotency:
  check: "Widget position {{index}} on page {{pageKey}} is one divider widget whose configuration equals {{widget}}"
failureModes:
  - symptom: "The requested divider style is unavailable"
    action: "Halt and report the available styles; do not choose a substitute."
  - symptom: "The requested widget position is occupied by a different widget type"
    action: "Halt and report the existing type; do not delete or reorder content."
provenance:
  authoredBy: human
  validatedAgainst: null
  lastReviewed: null
