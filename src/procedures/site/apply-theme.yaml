# EXAMPLE ONLY — selectors are placeholders until Week 4 sandbox validation.
# This file documents the procedure FORMAT, not real Cvent selectors.

id: site/apply-theme
version: 1
goal: >
  Apply the specified template and colour palette to the event website.

preconditions:
  - Event exists and is bound to the run's event id
  - Operator's Cvent session is active in the browser

# Ordered steps. Natural language carries intent; selector hints are attempted
# first and the agent falls back to reading the page only when they miss.
# Prefer role/ARIA anchors over CSS classes — Cvent ships UI changes.
steps:
  - description: Open the event website designer
    selectorHint: "role=link[name='Website']"
    verify: "role=heading[name='Site Designer']"

  - description: Open the theme picker
    selectorHint: "role=button[name='Theme']"

  - description: Select the template named in the spec
    selectorHint: "role=option[name='{{theme.templateName}}']"
    onMiss: >
      Read the visible template list. If no exact name match exists, halt with
      reason "template-not-found" and list what was available. Do NOT substitute
      a similar-looking template.

  - description: Set the primary colour
    selectorHint: "input[data-role='primary-color']"
    value: "{{theme.palette.primary}}"

  - description: Save the theme
    selectorHint: "role=button[name='Save']"
    verify: "text=Changes saved"

# Checked BEFORE the steps run. If already satisfied, the task is skipped —
# this is what makes retries resume rather than duplicate.
idempotency:
  check: "The active theme name equals {{theme.templateName}} and the primary swatch equals {{theme.palette.primary}}"

# Known failure modes. Cheaper to encode than to rediscover each run.
failureModes:
  - symptom: "Unsaved-changes modal blocks navigation"
    action: "Choose 'Discard' — the spec is the source of truth, not prior state."
  - symptom: "Theme picker renders empty"
    action: "Reload once. If still empty, halt with reason 'theme-picker-empty'."

# Set by the merge process, not by the agent. Proposed updates land as a PR.
provenance:
  authoredBy: human
  validatedAgainst: null   # fill with the Cvent build id at Week 4
  lastReviewed: null
