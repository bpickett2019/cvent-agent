id: site/apply-theme
version: 2
goal: Reconcile the mapped Site Designer theme fields exactly, with one save and independent read-back.
preconditions:
  - Event URL evtstub equals the run event id and the exact authorized event name is visible
  - Browser title is Site Designer and [data-cvent-id="nucleus-site-editor-site-header"] is visible
  - Top-level Save is disabled at task start; otherwise halt on a pre-existing draft
steps:
  - description: Read the current theme before writing; assert the Theme breadcrumb and exact active theme {{theme.templateName}}
    selectorHint: '[data-cvent-id="editor-panel-tab-EditorTabTypes.STYLE"]'
    verify: 'Breadcrumb contains Theme and visible panel contains {{theme.templateName}}'
    onMiss: Halt with theme-not-found; do not select a similar theme.
  - description: Reconcile only the requested theme palette and font fields after reading every target value
    selectorHint: '[data-cvent-id="nucleus-site-editor-menu-item-palette"]'
    value: '{{theme}}'
    onMiss: Halt if a requested field lacks an exact mapped control; do not use Change Theme, Save as, Reset Theme Styles, or More Actions.
  - description: Save the complete reconciled surface exactly once
    selectorHint: '[data-cvent-id="site-designer-save-button"]'
    verify: 'The save completes and the top-level Save returns to disabled'
  - description: Reload the same event-scoped Site Designer route and independently read back the theme
    selectorHint: '[data-cvent-id="editor-panel-tab-EditorTabTypes.STYLE"]'
    verify: 'Theme breadcrumb, exact theme name {{theme.templateName}}, and every requested value equal {{theme}}'
idempotency:
  check: 'Read back shows the exact requested theme fields {{theme}}; if equal, perform no write and no save.'
failureModes:
  - symptom: Event, title, surface, breadcrumb, or starting clean-state guard fails
    action: Halt without changing state.
  - symptom: Saved values differ after reload
    action: Report FAIL with before, intended, and after values; do not retry Save.
provenance:
  authoredBy: agent-proposed
  validatedAgainst: retained-agent-6-site-designer-map
  lastReviewed: '2026-09-01'
