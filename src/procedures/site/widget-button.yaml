id: site/widget-button
version: 1
goal: >
  Place the specified button widget at the requested page index with its exact
  label, action, and external URL when applicable.
preconditions:
  - The website page with key {{pageKey}} exists
  - The page is open in the website designer
steps:
  - description: Open page {{pageKey}} and inspect widget position {{index}}
    selectorHint: "TODO"
  - description: Add or select the button widget at position {{index}}
    selectorHint: "TODO"
  - description: Apply the exact button widget configuration {{widget}}
    selectorHint: "TODO"
  - description: Save and confirm the button label and destination action
    selectorHint: "TODO"
idempotency:
  check: "Widget position {{index}} on page {{pageKey}} is one button widget whose configuration equals {{widget}}"
failureModes:
  - symptom: "The requested destination action is unavailable"
    action: "Halt and report the available actions; do not choose a substitute."
  - symptom: "The requested widget position is occupied by a different widget type"
    action: "Halt and report the existing type; do not delete or reorder content."
provenance:
  authoredBy: human
  validatedAgainst: null
  lastReviewed: null
