id: site/widget-video
version: 1
goal: >
  Place the specified video widget at the requested page index with the exact
  video URL and caption.
preconditions:
  - The website page with key {{pageKey}} exists
  - The page is open in the website designer
steps:
  - description: Open page {{pageKey}} and inspect widget position {{index}}
    selectorHint: "TODO"
  - description: Add or select the video widget at position {{index}}
    selectorHint: "TODO"
  - description: Apply the exact video widget configuration {{widget}}
    selectorHint: "TODO"
  - description: Save and confirm the video URL and caption
    selectorHint: "TODO"
idempotency:
  check: "Widget position {{index}} on page {{pageKey}} is one video widget whose configuration equals {{widget}}"
failureModes:
  - symptom: "Cvent cannot load or validate the supplied video URL"
    action: "Halt and report the URL and validation message; do not substitute content."
  - symptom: "The requested widget position is occupied by a different widget type"
    action: "Halt and report the existing type; do not delete or reorder content."
provenance:
  authoredBy: human
  validatedAgainst: null
  lastReviewed: null
